name: PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '18'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'packages/shared/**'
            frontend:
              - 'apps/web/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'

  shared-checks:
    name: Validate Shared Package
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Disable CI checks
        run: echo "CI=false" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 10

      - name: Type check shared package
        run: |
          cd packages/shared
          npm run type-check
        timeout-minutes: 5

      - name: Build shared package
        run: |
          cd packages/shared
          npm run build
        timeout-minutes: 5

  backend-checks:
    name: Validate Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Disable CI checks
        run: echo "CI=false" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 10

      - name: Build shared package
        run: |
          cd packages/shared
          npm run build
        timeout-minutes: 5

      - name: Type check backend
        run: |
          cd apps/api
          npm run type-check
        timeout-minutes: 5

      - name: Build backend
        run: |
          cd apps/api
          npm run build
        timeout-minutes: 10

  frontend-checks:
    name: Validate Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Disable CI checks
        run: echo "CI=false" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
        timeout-minutes: 10

      - name: Build shared package
        run: |
          cd packages/shared
          npm run build
        timeout-minutes: 5

      - name: Type check frontend
        run: |
          cd apps/web
          npm run type-check
        timeout-minutes: 5

      - name: Build frontend
        run: |
          cd apps/web
          npm run build
        timeout-minutes: 15

  pr-validation-status:
    name: PR Validation Status
    runs-on: ubuntu-latest
    needs: [changes, shared-checks, backend-checks, frontend-checks]
    if: always()
    
    steps:
      - name: Check validation results
        run: |
          if [[ "${{ needs.shared-checks.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-checks.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-checks.result }}" == "failure" ]]; then
            echo "❌ PR validation failed"
            exit 1
          elif [[ "${{ needs.shared-checks.result }}" == "success" ]] || \
               [[ "${{ needs.backend-checks.result }}" == "success" ]] || \
               [[ "${{ needs.frontend-checks.result }}" == "success" ]]; then
            echo "✅ PR validation passed"
            exit 0
          else
            echo "⏭️ No validation needed (no relevant changes detected)"
            exit 0
          fi

